<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fichitas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;background:#cdeefd;color:#24506b}
.screen{height:100vh;display:flex;flex-direction:column}
@supports (height:100dvh){.screen{height:100dvh}}
.hidden{display:none!important}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;font-weight:800}
header .name{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.pill{font-size:19px;background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 2px 0 #9ccde6;white-space:nowrap}
.rbtn{font-size:20px;background:#fff;border:0;border-radius:999px;width:42px;height:42px;flex:0 0 42px;box-shadow:0 2px 0 #9ccde6;color:#24506b;font-family:inherit}
.rbtn.on{background:#ffd84d;box-shadow:0 2px 0 #d4a900}
.rbtn.off{opacity:.45}
.wbtn{font-size:17px;font-weight:800;background:#fff;border:0;border-radius:999px;padding:0 14px;height:42px;box-shadow:0 2px 0 #9ccde6;color:#24506b;font-family:inherit;white-space:nowrap}
.wbtn.gold{background:#ffd84d;box-shadow:0 2px 0 #d4a900}
/* ---------- Inicio ---------- */
#menu h1,#home h1{font-size:28px;letter-spacing:.5px}
#homeBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:4px 16px 16px}
#modes{display:flex;gap:14px}
.mode{flex:1;border:0;border-radius:22px;padding:14px 18px;font:inherit;font-size:22px;font-weight:900;color:#24506b;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;box-shadow:0 5px 0 #9ccde6}
.mode.cont{background:#ffd84d;box-shadow:0 5px 0 #d4a900}
.mode.free{background:#ff6fae;color:#fff;box-shadow:0 5px 0 #d63d82}
.mode.rescue{background:#e63b2e;color:#fff;box-shadow:0 5px 0 #a82015}
.mode.m3d{background:#8a4fc7;color:#fff;box-shadow:0 5px 0 #5f3191;text-decoration:none}
.mode.papa{background:#2f6fdb;color:#fff;box-shadow:0 5px 0 #1d4a9e}
#diffs{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:14px}
.diff{position:relative;border:0;border-radius:26px;color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 0 rgba(0,0,0,.18);min-height:0}
.diff .emo{font-size:clamp(28px,5.5vh,56px);line-height:1;text-shadow:none}
.diff .num{font-size:clamp(22px,4.2vh,38px);font-weight:900;line-height:1}
.diff .rng{font-size:15px;font-weight:800;opacity:.95}
.diff .ds{font-size:14px;font-weight:900;background:rgba(255,255,255,.3);border-radius:999px;padding:1px 10px}
.diff.locked{filter:grayscale(.85);opacity:.55}
.diff.locked::after{content:"🔒";position:absolute;top:8px;right:12px;font-size:26px}
.diff.nope,.card.nope{animation:nope .45s}
.diff:active:not(.locked){transform:scale(.97)}
/* ---------- Modelos de un nivel ---------- */
#levels{flex:1;min-height:0;display:flex;padding:0 14px 14px}
.cards{flex:1;display:grid;gap:12px;min-width:0;grid-auto-rows:1fr}
.card{position:relative;border:0;background:#fff;border-radius:22px;box-shadow:0 4px 0 #9ccde6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:0;overflow:hidden;color:#24506b;font-family:inherit}
.card .mini{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.card .mini>div{position:relative}
.card .foot{flex:0 0 auto;font-size:15px;font-weight:800;padding-top:4px;white-space:nowrap}
.card .prog{position:absolute;left:10px;top:8px;font-size:13px;font-weight:900;background:#ffd84d;border-radius:999px;padding:1px 8px}
.card.locked .mini{filter:grayscale(1) brightness(1.15);opacity:.35}
.card.locked::after{content:"🔒";position:absolute;font-size:38px;top:50%;left:50%;transform:translate(-50%,-60%)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;color:#5d86a0;padding:20px}
/* ---------- Juego / editor ---------- */
main{flex:1;display:flex;flex-direction:row;min-height:0;gap:12px;padding:0 12px 12px}
aside{flex:0 0 clamp(210px,30vw,360px);display:flex;flex-direction:column;gap:12px;min-height:0}
.panel{background:#fff;border-radius:22px;box-shadow:0 4px 0 #9ccde6}
#modelBox{flex:0 0 30%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#modelBox::before{content:"👀";position:absolute;top:6px;left:10px;font-size:20px;opacity:.8}
#model{position:relative}
.bagbox{position:absolute;border:3px solid #ff8a1f;border-radius:6px;box-shadow:0 0 0 2000px rgba(255,255,255,.45);pointer-events:none;z-index:9}
#tray,#eShapes{flex:1;min-height:0;overflow:hidden;padding:10px;display:grid;gap:10px;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
#eShapes{grid-template-columns:repeat(2,1fr);overflow-y:auto;grid-auto-rows:minmax(70px,1fr)}
.tile{position:relative;border:0;border-radius:16px;background:#f2f8fc;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,background .2s;min-height:0}
.tile.sel{background:#fff8d6;box-shadow:0 0 0 4px #ffd84d}
.cnt{position:absolute;right:8px;bottom:6px;font-size:16px;font-weight:900;color:#24506b;background:#fff;border-radius:999px;padding:1px 8px;box-shadow:0 1px 0 #cfe3ef;z-index:5}
.tile.used{background:transparent;outline:2px dashed #e2edf3;outline-offset:-4px}
.tile.next{background:#fff8d6;box-shadow:0 0 0 4px #ffd84d,0 0 20px 4px rgba(255,216,77,.7)}
.tile.next .pw{animation:hop 1.5s ease-in-out infinite}
.tile.nope .pw{animation:nope .45s ease-in-out}
.pw{position:relative}
.tile.press{transform:scale(.9);transition:transform .08s}
.tile{transition:transform .12s,box-shadow .2s,background .2s}
.spark{position:fixed;z-index:55;width:9px;height:9px;border-radius:2px;pointer-events:none}
.board.shake{animation:shake .22s ease-out}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(0,3px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,1px)}100%{transform:translate(0,0)}}
.shine{position:absolute;inset:-10% -30%;pointer-events:none;z-index:20;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);animation:shine .9s ease-in-out forwards}
@keyframes shine{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.word{position:absolute;left:50%;top:10%;z-index:30;pointer-events:none;white-space:nowrap;font-weight:900;font-size:clamp(34px,6.5vw,68px);
  color:#fff!important;letter-spacing:1px;
  text-shadow:2px 0 0 #111,-2px 0 0 #111,0 2px 0 #111,0 -2px 0 #111,1.5px 1.5px 0 #111,-1.5px -1.5px 0 #111,1.5px -1.5px 0 #111,-1.5px 1.5px 0 #111,0 4px 6px rgba(0,0,0,.25);
  animation:word 1.7s ease-out forwards}
@keyframes word{0%{transform:translate(-50%,20px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.12);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
#tray.fresh .tile{animation:pop .45s ease-out}
#tray{grid-template-columns:1fr!important;grid-auto-rows:1fr}
#eColors{flex:0 0 auto;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#editor{touch-action:none}
.preview{opacity:.6;filter:drop-shadow(0 0 2px #ff6a00) drop-shadow(0 0 2px #ff6a00) drop-shadow(0 0 8px #ffcf33);pointer-events:none;z-index:8}
.dragging{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3))}
.sw{border:0;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.sw.sel{outline:4px solid #24506b;outline-offset:2px}
.stage{flex:1;min-width:0;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(#bfe9ff 0%,#e6f7ff 72%,#9be27a 72%,#7fcf5b 100%);box-shadow:0 4px 0 #9ccde6}
.wrap{position:absolute;display:flex;flex-direction:column;align-items:center}
#boardWrap{transform-origin:0 0;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.board{position:relative}
.plate{background:#4cb54a;border-radius:6px;box-shadow:inset 0 -6px 0 #2f8f33}
.grid{position:absolute;inset:0;pointer-events:none}
.layer{position:absolute;inset:0}
/* ---------- fichas (proporciones reales: botón 8 mm, ladrillo 9,6 mm, placa 3,2 mm) ---------- */
.pc{position:absolute}
.bd{position:absolute;inset:0}
.stud{position:absolute;display:block}
.k-ru{z-index:3}
.eyeP{position:absolute;left:14%;width:72%;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55);display:block}
.eyeP i{position:absolute;left:30%;top:26%;width:46%;height:46%;border-radius:50%;background:#222;display:block}
.eyeP i::after{content:"";position:absolute;left:18%;top:16%;width:30%;height:30%;border-radius:50%;background:#fff}
.fx{position:absolute;clip-path:polygon(12% 0,88% 0,96% 38%,76% 62%,66% 46%,50% 100%,34% 46%,24% 62%,4% 38%);background:linear-gradient(#fff3a0,#ffc92a 30%,#ff8a1f 65%,#e63b2e);transform-origin:50% 0;animation:flick .1s linear infinite alternate}
/* silueta */
.ghost{opacity:.12;filter:grayscale(1)}
.ghost.far{opacity:.05}
.ghost.now{opacity:.6;z-index:6;filter:drop-shadow(0 0 2px #ff6a00) drop-shadow(0 0 2px #ff6a00) drop-shadow(0 0 8px #ffcf33);animation:gpulse 1s ease-in-out infinite}
/* ficha que sigue (sin ayuda): silueta oscura con borde naranja que parpadea */
.ghost.shade{opacity:1;z-index:6;filter:grayscale(1) brightness(.3) drop-shadow(0 0 1.5px #ff6a00) drop-shadow(0 0 1.5px #ff6a00) drop-shadow(0 0 1.5px #ff6a00) drop-shadow(0 0 10px #ffb000);animation:spulse 1s ease-in-out infinite}
.ghost.look{animation:look .5s ease-in-out 3}
#tray{position:relative}
#tray.wait .tile{opacity:.35;filter:grayscale(.7)}
#tray.wait::after{content:"⏳";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;animation:wob 1s ease-in-out infinite}
.pop{animation:pop .3s ease-out;transform-origin:50% 100%}
.drop{animation:drop .32s cubic-bezier(.5,0,.75,1)}
.fly{position:fixed;z-index:50;transform-origin:0 0;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.rm .pc{cursor:pointer}
.rm .pc:hover{filter:brightness(.8)}
/* animaciones de victoria */
.board.go-drive .car{animation:drive 2.6s cubic-bezier(.55,0,.85,.35) .3s forwards}
.board.go-drive .k-ru .bd{animation:spin .35s linear infinite}
.board.go-launch .car{animation:launch 2.8s cubic-bezier(.6,0,.9,.4) .3s forwards}
.board.go-jump .car{animation:jump .9s ease-in-out .3s 3;transform-origin:50% 100%}
.board.go-sway .car{animation:sway 1s ease-in-out .3s 3;transform-origin:50% 100%}
.board.go-sail .car{animation:sail 3s ease-in-out .3s forwards}
/* capas emergentes */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,60,90,.4)}
.ov.show{display:flex}
#bagBtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#bagBtn .pk{font-size:150px;line-height:1;animation:wob 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.2))}
#bagBtn .n{font-size:34px}
#bagBtn .s{font-size:18px;opacity:.9}
#bag.open .pk{animation:openBag .45s ease-in forwards}
.box{background:#fff;border-radius:28px;padding:22px 26px;width:min(380px,92vw);text-align:center;box-shadow:0 8px 0 #9ccde6;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto}
.box h3{font-size:22px}
#win .box{width:auto;padding:26px 36px;animation:pop .5s}
#win .star{font-size:90px;line-height:1;animation:spinIn .8s ease-out}
#win h2{font-size:28px}
.btns{display:flex;gap:18px;justify-content:center;align-items:center}
.btns button{border:0;border-radius:50%;color:#24506b}
#home2,#again{font-size:30px;width:72px;height:72px;background:#e8f4fb;box-shadow:0 5px 0 #9ccde6}
#next{font-size:44px;width:100px;height:100px;background:#ffd84d;box-shadow:0 6px 0 #d4a900}
.dots{display:flex;gap:12px;justify-content:center;height:22px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid #9ccde6;display:block}
.dots i.on{background:#24506b;border-color:#24506b}
.dots.bad{animation:nope .45s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.keys button{border:0;border-radius:16px;background:#e8f4fb;box-shadow:0 3px 0 #9ccde6;font:inherit;font-size:26px;font-weight:800;color:#24506b;height:58px}
.pbtn{border:0;border-radius:16px;background:#e8f4fb;box-shadow:0 3px 0 #9ccde6;font:inherit;font-size:18px;font-weight:800;color:#24506b;padding:14px}
.pbtn.gold{background:#ffd84d;box-shadow:0 3px 0 #d4a900}
.pbtn.warn{background:#ffe3e0;box-shadow:0 3px 0 #f0a9a1}
.pbtn.ghostb{background:none;box-shadow:none;font-size:16px;padding:6px}
.col{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:8px;background:#f2f8fc;border-radius:14px;padding:8px 10px;font-weight:800;text-align:left}
.crow span{flex:1}
.crow button{border:0;background:#fff;border-radius:10px;font-size:18px;width:40px;height:36px;box-shadow:0 2px 0 #cfe3ef}
#sName{font:inherit;font-size:20px;font-weight:800;color:#24506b;border:3px solid #9ccde6;border-radius:14px;padding:10px 12px;-webkit-user-select:text;user-select:text}
#sEmos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#sEmos button{border:0;background:#f2f8fc;border-radius:12px;font-size:26px;height:48px}
#sEmos button.sel{background:#ffd84d}
.conf{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes hop{0%,55%,100%{transform:translateY(0)}20%{transform:translateY(-14%)}38%{transform:translateY(0)}46%{transform:translateY(-5%)}}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-5deg)}40%{transform:translateX(9px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes gpulse{0%,100%{opacity:.3}50%{opacity:.75}}
@keyframes spulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes look{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18%) scale(1.15)}}
@keyframes pop{0%{transform:scale(1.12,.86)}60%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-160px);opacity:.3}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drive{0%{transform:translateX(0)}12%{transform:translateX(-4%)}100%{transform:translateX(160vw)}}
@keyframes launch{0%,20%{transform:translate(0,0)}4%,12%{transform:translate(-3px,0)}8%,16%{transform:translate(3px,0)}100%{transform:translateY(-170vh)}}
@keyframes sail{0%{transform:translate(0,0) rotate(0)}15%{transform:translate(-2%,0) rotate(-2deg)}30%{transform:translate(0,-1%) rotate(2deg)}100%{transform:translate(160vw,0) rotate(0)}}
@keyframes flick{from{transform:scaleY(1)}to{transform:scaleY(1.35)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}12%{transform:scale(1.1,.88)}45%{transform:translateY(-28%) scale(.95,1.06)}78%{transform:translateY(0) scale(1.08,.92)}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spinIn{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.05)}}
@keyframes openBag{to{transform:scale(1.8);opacity:0}}
/* pantallas bajitas (iPhone acostado): el inicio se desplaza */
@media (max-height:520px){
  #diffs{flex:none;grid-auto-rows:130px}
  #homeBody{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
}
@media (orientation:portrait){
  main{flex-direction:column-reverse}
  aside{flex:0 0 36%;flex-direction:row}
  #modelBox{flex:0 0 34%}
  #eColors{flex:0 0 38%;grid-template-columns:repeat(3,1fr);align-content:start;overflow-y:auto}
  #eShapes{grid-template-columns:repeat(3,1fr)}
  #diffs{grid-template-columns:repeat(2,1fr);flex:none;grid-auto-rows:150px}
  #modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{font-size:17px;padding:10px 8px}
  .mode.cont{grid-column:1/-1}
  #modes .mode.m3d{grid-column:1/-1}
  #homeBody{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:30px}
  #home h1{font-size:22px;white-space:nowrap}
  #home header{gap:6px;padding:8px 10px}
  #home .rbtn{width:38px;height:38px;flex-basis:38px;font-size:18px}
  .diff .rng{font-size:12px}
  .card .foot{font-size:12px}
  .cnt{font-size:11px;right:2px;bottom:2px;padding:0 4px}
  .pill{font-size:15px;padding:3px 10px}
  .wbtn{font-size:14px;padding:0 10px}
}
</style>
</head>
<body>
<!-- INICIO -->
<div id="home" class="screen">
  <header><h1>🧱 Fichitas</h1><span class="sp"></span><span class="pill" id="total">⭐ 0</span><button class="rbtn mus" aria-label="Música">🎵</button><button class="rbtn snd" aria-label="Sonido">🔊</button><button class="rbtn" id="gear" aria-label="Papás">⚙️</button></header>
  <div id="homeBody">
    <div id="modes">
      <button class="mode cont hidden" id="cont"></button>
      <button class="mode free" id="goFree">🎨 Modo libre</button>
      <button class="mode rescue" id="goRescue">🚨 Rescate</button>
      <a class="mode m3d hidden" id="go3d" href="3d/">🧊 3D</a>
      <button class="mode papa hidden" id="goPapa"></button>
    </div>
    <div id="diffs"></div>
  </div>
</div>
<!-- MODELOS DE UN NIVEL -->
<div id="menu" class="screen hidden">
  <header><button class="rbtn" id="back" aria-label="Inicio">⬅️</button><span class="name" id="lvlName"></span><span class="sp"></span><span class="pill" id="lvlStars">⭐ 0</span></header>
  <div id="levels"></div>
</div>
<!-- JUEGO -->
<div id="game" class="screen hidden">
  <header><button class="rbtn" id="homeBtn" aria-label="Modelos">🏠</button><span class="name" id="figName"></span><span class="sp"></span><span class="pill" id="bagPill"></span><span class="pill" id="stars">⭐ 0</span><button class="rbtn mus" aria-label="Música">🎵</button><button class="rbtn snd" aria-label="Sonido">🔊</button></header>
  <main>
    <aside><div id="modelBox" class="panel"><div id="model"></div></div><div id="tray" class="panel"></div></aside>
    <section class="stage" id="stage"><div class="wrap" id="boardWrap"><div class="board" id="board"></div><div class="plate" id="plate"></div></div></section>
  </main>
</div>
<!-- EDITOR (modo libre / modo papá) -->
<div id="editor" class="screen hidden">
  <header><button class="rbtn" id="eBack" aria-label="Inicio">⬅️</button><span class="name" id="eTitle"></span><span class="sp"></span>
    <span class="pill" id="eCount">🧱 0</span>
    <button class="rbtn mus" aria-label="Música">🎵</button>
    <button class="rbtn" id="eUndo" aria-label="Deshacer">↶</button>
    <button class="rbtn" id="eRm" aria-label="Quitar">🧽</button>
    <button class="rbtn" id="eClear" aria-label="Borrar todo">🗑️</button>
    <button class="wbtn papaOnly" id="eImport">📥 Traer modo libre</button>
    <button class="wbtn gold papaOnly" id="eSave">💾 Guardar</button></header>
  <main>
    <aside><div id="eColors" class="panel"></div><div id="eShapes" class="panel"></div></aside>
    <section class="stage" id="eStage"><div class="wrap" id="eWrap"><div class="board" id="eBoard"></div><div class="plate" id="ePlate"></div></div></section>
  </main>
</div>
<!-- capas -->
<div id="bag" class="ov"><button id="bagBtn"><span class="pk">📦</span><span class="n" id="bagN"></span><span class="s" id="bagS"></span></button></div>
<div id="win" class="ov"><div class="box"><div class="star">⭐</div><h2>¡Lo lograste!</h2>

<script>
// =====================================================================
//  FICHAS — basadas en piezas reales de Lego, vistas de frente.
//  Medidas reales: botón (stud) cada 8 mm · ladrillo 9,6 mm de alto · placa 3,2 mm (3 placas = 1 ladrillo)
//  botón de 4,8 mm de diámetro y 1,7 mm de alto.  Unidad horizontal = 1 botón, unidad vertical = 1 placa.
// =====================================================================
const PL=3.2/8;            // alto de una placa en "botones"
const STUD_W=4.8/8, STUD_H=1.7/8;
const CAT={
  // ladrillos (Brick 1xN)
  b1:{w:1,h:3,kind:'brick',name:'Ladrillo 1x1'}, b2:{w:2,h:3,kind:'brick',name:'Ladrillo 1x2'},
  b3:{w:3,h:3,kind:'brick',name:'Ladrillo 1x3'}, b4:{w:4,h:3,kind:'brick',name:'Ladrillo 1x4'},
  b6:{w:6,h:3,kind:'brick',name:'Ladrillo 1x6'}, b8:{w:8,h:3,kind:'brick',name:'Ladrillo 1x8'},
  // placas (Plate 1xN)
  p1:{w:1,h:1,kind:'brick',name:'Placa 1x1'}, p2:{w:2,h:1,kind:'brick',name:'Placa 1x2'},
  p3:{w:3,h:1,kind:'brick',name:'Placa 1x3'}, p4:{w:4,h:1,kind:'brick',name:'Placa 1x4'},
  p6:{w:6,h:1,kind:'brick',name:'Placa 1x6'},
  // lisos sin botones (Tile 1xN)
  t1:{w:1,h:1,kind:'tile',name:'Liso 1x1'}, t2:{w:2,h:1,kind:'tile',name:'Liso 1x2'}, t4:{w:4,h:1,kind:'tile',name:'Liso 1x4'},
  // tejas (Slope 45° 2x1), cumbrera (Slope 45° 2x2 doble) y teja queso (Slope 30° 1x1x2/3)
  sI:{w:2,h:3,kind:'slopeI',name:'Teja 45° 2x1'}, sD:{w:2,h:3,kind:'slopeD',name:'Teja 45° 2x1'},
  ri:{w:2,h:3,kind:'ridge',name:'Cumbrera 45°'},
  qI:{w:1,h:2,kind:'cheeseI',name:'Teja queso 1x1'}, qD:{w:1,h:2,kind:'cheeseD',name:'Teja queso 1x1'},
  // especiales
  rd:{w:1,h:3,kind:'round',name:'Ladrillo redondo 1x1'}, ojo:{w:1,h:3,kind:'eye',name:'Ladrillo 1x1 con ojo'},
  ar:{w:4,h:3,kind:'arch',name:'Arco 1x4'}, ru:{w:2,h:5,kind:'wheel',name:'Rueda'}
};
const COL={r:['#d9281c','#a01a10'],y:['#fac80a','#c99a00'],b:['#9fd8f2','#5aaed4'],o:['#fe8a18','#c96200'],
  g:['#00a33a','#007428'],n:['#7c4e2a','#56331a'],w:['#f4f4f4','#c8ccd0'],p:['#8a4fc7','#5f3191'],
  k:['#a0a5a9','#6f7478'],m:['#ff8ec6','#d95a9b'],a:['#0055bf','#003b87'],x:['#272a2d','#0d0e10'],
  L:['#a5ca18','#77940c'],D:['#184632','#0c2b1d'],C:['#e4cd9e','#b9a172'],M:['#c9208e','#911465'],B:['#0a3463','#041f3d'],R:['#7b1a14','#52100c']};
const P=(k,c,x,y)=>({k,c,x,y,w:CAT[k].w,h:CAT[k].h});
const key=s=>s.k+s.c;

// ================== NIVELES ==================
const LEVELS=[null,
  {range:'1–5',max:4},{range:'5–15',max:4},{range:'15–35',max:3},{range:'35–50',max:2},
  {range:'50–100',max:2},{range:'100–200',max:2},{range:'200–400',max:2}];
const lvlFor=n=>n<=5?1:n<=15?2:n<=35?3:n<=50?4:n<=100?5:n<=200?6:7;
const BAG_FROM=50;
/*MODELS*/
function finishFigure(F){
  const steps=F.steps;
  F.rows=Math.max(...steps.map(s=>s.y+s.h))+1;
  F.cols=Math.max(F.cols||0,Math.ceil(Math.max(...steps.map(s=>s.x+s.w))));
  F.bags=[0];
  if(steps.length>BAG_FROM){
    let i=0;
    while(steps.length-i>15){
      const rem=steps.length-i;
      if(rem<=25){F.bags.push(i+Math.ceil(rem/2));break}
      let cut=i+12;
      for(let d=0;d<=3;d++){for(const j of [i+12+d,i+12-d]){if(j>i+9&&j<=i+15&&steps[j].y!==steps[j-1].y){cut=j;d=9;break}}}
      F.bags.push(cut);i=cut;
    }
  }
}
// arma cada modelo con su constructor, ordena de abajo hacia arriba y le asigna nivel por cantidad de fichas
const FIGURES=MODELS.concat(RESCUE).map(m=>{
  const B=makeBuilder();m.build(B);
  const steps=B.pieces.slice().sort((p,q)=>p.y-q.y);
  const minX=Math.min(...steps.map(s=>s.x));steps.forEach(s=>s.x-=minX);
  const F={id:m.id,name:m.name,emo:m.emo,anim:m.anim,steps,set:m.set||null};F.lvl=lvlFor(steps.length);finishFigure(F);return F;
}).sort((a,b)=>a.steps.length-b.steps.length);

// ================== GUARDADO EN EL DISPOSITIVO ==================
const KEY='fichitas_v1';
let save={stars:{},prog:{},muted:false,unlockAll:false,custom:[],free:[],draft:{id:null,pieces:[]}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=Object.assign(save,s)}catch(e){}
save.prog=save.prog||{};save.custom=save.custom||[];save.free=save.free||[];save.draft=save.draft||{id:null,pieces:[]};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

// modelos creados por papá
function customFigure(c){
  const pcs=c.pieces.slice().sort((a,b)=>a.y-b.y||a.x-b.x);
  const minX=Math.min(...pcs.map(p=>p.x));
  const F={id:c.id,name:c.name,emo:c.emo,custom:true,anim:'jump',steps:pcs.map(p=>P(p.k,p.c,p.x-minX,p.y))};
  F.lvl=lvlFor(F.steps.length);finishFigure(F);return F;
}
let FIGS=[];
function rebuildFigs(){FIGS=FIGURES.concat(save.custom.filter(c=>c.pieces.length).map(customFigure))}
rebuildFigs();

const $=s=>document.querySelector(s);
let figIdx=0,st=null,C=40,busy=false,screen='home',curLvl=1,cam={L0:0,T0:0,tx:0,ty:0,z:1};
const fig=()=>FIGS[figIdx];
const HELP_STEPS=2;                                // ayuda solo en las 2 primeras fichas
const helped=()=>!!st&&st.placed<HELP_STEPS;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// ================== SONIDO ==================
let AC;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type='triangle',v=.22){if(save.muted)return;const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
let noiseBuf=null;
function click(v=.35){const a=ac();if(!a||save.muted)return;try{
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.05,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6)}
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf;f.type='bandpass';f.frequency.value=2600;f.Q.value=1.2;g.gain.value=v;
  src.connect(f).connect(g).connect(a.destination);src.start()}catch(e){}}
const SCALE=[523,587,659,784,880,1047,1175,1319,1568,1760];
let combo=0;
const sSnap=()=>{click();tone(SCALE[Math.min(combo,SCALE.length-1)],.02,.22,'triangle',.2);tone(SCALE[Math.min(combo,SCALE.length-1)]*1.5,.06,.18,'sine',.06)};
const sWhoosh=()=>tone(400,0,.25,'sine',.08);
const sTap=()=>tone(880,0,.08,'sine',.12);
const sBag=()=>{tone(523,0,.15);tone(784,.12,.25)};
const sRip=()=>{tone(300,0,.12,'sawtooth',.06);tone(900,.08,.2,'triangle',.15)};
const sPop=()=>tone(260,0,.12,'sine',.15);
const sFan=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3));tone(1319,.6,.7)};
function updSnd(){document.querySelectorAll('.snd').forEach(b=>b.textContent=save.muted?'🔇':'🔊')}
document.querySelectorAll('.snd').forEach(b=>b.addEventListener('pointerdown',()=>{save.muted=!save.muted;persist();updSnd();ac()}));

// ================== MÚSICA DE FONDO (caja musical, hecha con el navegador) ==================
const NOTE={G4:392,A4:440,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C3:130.81,F3:174.61,G2:98,A2:110,G3:196};
const MEL=['C5','E5','G5','E5','D5','E5','C5',0,'A4','C5','D5','C5','G4','A4','C5',0,
           'C5','E5','G5','A5','G5','E5','D5',0,'E5','D5','C5','A4','C5',0,0,0];
const BASS=['C3','C3','A2','G2','C3','F3','G3','C3'];
let mTimer=null,mStep=0;
function musicTick(){
  if(save.muted||save.music===false||document.hidden)return;
  const a=ac();if(!a)return;
  const n=MEL[mStep%MEL.length];
  if(n){tone(NOTE[n],0,.45,'sine',.05);tone(NOTE[n]*2,0,.25,'sine',.012)}
  if(mStep%4===0)tone(NOTE[BASS[(mStep/4|0)%BASS.length]],0,1.1,'triangle',.04);
  mStep++;
}
function startMusic(){if(!mTimer)mTimer=setInterval(musicTick,320)}
function updMus(){document.querySelectorAll('.mus').forEach(b=>b.classList.toggle('off',save.music===false))}
document.addEventListener('pointerdown',()=>{ac();startMusic()},{passive:true});
document.querySelectorAll('.mus').forEach(b=>b.addEventListener('pointerdown',ev=>{ev.stopPropagation();ac();startMusic();
  save.music=save.music===false;persist();updMus()}));

// ================== VIBRACIÓN ==================
// Android: navigator.vibrate. iPhone con iOS 18+: truco del interruptor (input switch) que da un toque háptico.
// Los iPad no tienen motor de vibración.
let hapLabel=null;
function buzz(ms=15){
  if(save.noHaptic)return;
  try{if(navigator.vibrate){navigator.vibrate(ms);return}}catch(e){}
  try{if(!hapLabel){const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.id='hap';
      hapLabel=document.createElement('label');hapLabel.htmlFor='hap';
      const box=document.createElement('div');box.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
      box.append(i,hapLabel);document.body.appendChild(box)}
    hapLabel.click()}catch(e){}
}

// ================== EFECTOS DE ENCAJE ==================
function sparks(x,y,color,n=10){
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='spark';d.style.background=i%3?color:'#fff';
    d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);
    const ang=Math.PI+Math.random()*Math.PI,dist=30+Math.random()*50;
    const an=d.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(.3) rotate(${Math.random()*360}deg)`,opacity:0}],
      {duration:450+Math.random()*250,easing:'cubic-bezier(.2,.7,.4,1)'});
    an.onfinish=()=>d.remove()}}
function shakeBoard(){board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake')}

// ================== INGLÉS: palabras en pantalla y voz ==================
// Usa la voz en inglés que trae el iPad/iPhone (funciona sin internet).
const EN_COL={r:'red',y:'yellow',b:'light blue',o:'orange',g:'green',n:'brown',w:'white',p:'purple',k:'gray',m:'pink',a:'blue',x:'black',
  L:'lime',D:'dark green',C:'tan',M:'magenta',B:'dark blue',R:'dark red'};
function enShape(k){if(k[0]==='b')return'brick';if(k[0]==='p')return'plate';if(k[0]==='t')return'tile';if(k==='ri')return'roof';
  if(k[0]==='s'||k[0]==='q')return'slope';if(k==='rd')return'round brick';if(k==='ojo')return'eye';if(k==='ar')return'arch';if(k==='ru')return'wheel';return'brick'}
const PRAISE=['Good job!','Great!','Awesome!','Well done!','Super!','Nice!'];
let enVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();
  enVoice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Ava|Allison|Google US English|Karen/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text,queue){if(save.muted||save.noEnglish)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(enVoice)u.voice=enVoice;u.rate=.85;u.pitch=1.15;
    if(!queue)speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function word(text,color,where){if(save.noEnglish)return;const host=where||$('#stage');host.querySelectorAll('.word').forEach(w=>w.remove());const d=document.createElement('div');d.className='word';
  d.textContent=text;d.style.color=color||'#fff';host.appendChild(d);setTimeout(()=>d.remove(),1800)}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);

// ================== DIBUJO DE FICHAS ==================
function studAt(e,i,c,col,dk){
  const d=document.createElement('i');d.className='stud';
  Object.assign(d.style,{left:(i*c+c*(1-STUD_W)/2)+'px',width:c*STUD_W+'px',height:c*STUD_H+'px',top:(-c*STUD_H+.5)+'px',
    background:`linear-gradient(90deg,${dk},${col} 30%,#ffffff55 45%,${col} 60%,${dk})`,borderRadius:`${c*.05}px ${c*.05}px 0 0`});
  e.appendChild(d);
}
function pieceEl(s,c){
  const T=CAT[s.k],[col,dk]=COL[s.c],e=document.createElement('div'),W=s.w*c,H=s.h*c*PL;
  e.className='pc k-'+s.k;e.style.width=W+'px';e.style.height=H+'px';
  const bd=document.createElement('div');bd.className='bd';e.appendChild(bd);
  const seam=`inset 1px 0 0 rgba(0,0,0,.18), inset -1px 0 0 rgba(0,0,0,.18)`;
  const shade=`inset 0 ${-Math.max(1,c*.08)}px 0 ${dk}, inset 0 ${Math.max(1,c*.05)}px 0 rgba(255,255,255,.35), ${seam}`;
  const small=c<7;
  switch(T.kind){
    case 'brick':bd.style.background=col;bd.style.borderRadius=c*.03+'px';bd.style.boxShadow=shade;
      if(!small)for(let i=0;i<s.w;i++)studAt(e,i,c,col,dk);break;
    case 'tile':bd.style.background=`linear-gradient(${'#ffffff66'},${col} 35%)`;bd.style.backgroundColor=col;bd.style.borderRadius=c*.03+'px';bd.style.boxShadow=shade;break;
    case 'slopeI':bd.style.background=`linear-gradient(135deg,${col} 40%,${dk})`;bd.style.clipPath='polygon(0 100%,0 67%,50% 0,100% 0,100% 100%)';if(!small)studAt(e,1,c,col,dk);break;
    case 'slopeD':bd.style.background=`linear-gradient(225deg,${col} 40%,${dk})`;bd.style.clipPath='polygon(0 0,50% 0,100% 67%,100% 100%,0 100%)';if(!small)studAt(e,0,c,col,dk);break;
    case 'ridge':bd.style.background=`linear-gradient(${col} 50%,${dk})`;bd.style.clipPath='polygon(0 100%,0 67%,45% 0,55% 0,100% 67%,100% 100%)';break;
    case 'cheeseI':bd.style.background=`linear-gradient(135deg,${col} 50%,${dk})`;bd.style.clipPath='polygon(0 100%,0 75%,100% 0,100% 100%)';break;
    case 'cheeseD':bd.style.background=`linear-gradient(225deg,${col} 50%,${dk})`;bd.style.clipPath='polygon(0 0,100% 75%,100% 100%,0 100%)';break;
    case 'round':bd.style.left='6%';bd.style.right='6%';bd.style.borderRadius=`${c*.12}px`;
      bd.style.background=`linear-gradient(90deg,${dk},${col} 30%,#ffffff70 48%,${col} 65%,${dk})`;if(!small)studAt(e,0,c,col,dk);break;
    case 'eye':bd.style.background=col;bd.style.borderRadius=c*.03+'px';bd.style.boxShadow=shade;if(!small)studAt(e,0,c,col,dk);
      {const ey=document.createElement('i');ey.className='eyeP';ey.style.height=W*.72+'px';ey.style.top=(H-W*.72)/2+'px';ey.innerHTML='<i></i>';e.appendChild(ey)}break;
    case 'arch':bd.style.background=col;bd.style.boxShadow=shade;
      bd.style.webkitMaskImage=bd.style.maskImage='radial-gradient(ellipse 25% 67% at 50% 100%,transparent 97%,#000 100%)';
      if(!small)for(let i=0;i<4;i++)studAt(e,i,c,col,dk);break;
    case 'wheel':bd.style.borderRadius='50%';
      bd.style.background=`radial-gradient(circle,#d8dadc 0 18%,#9a9ea2 19% 30%,#d8dadc 31% 40%,#1c1d1f 42% 100%)`;
      bd.style.boxShadow='inset 0 0 0 2px #000';break;
  }
  return e;
}
function at(el,s,c,rows){el.style.left=s.x*c+'px';el.style.top=(rows-s.y-s.h)*c*PL+'px';return el}
function drawFigure(box,F,c){box.innerHTML='';box.style.width=F.cols*c+'px';box.style.height=F.rows*c*PL+'px';
  const fr=document.createDocumentFragment();F.steps.forEach(s=>fr.appendChild(at(pieceEl(s,c),s,c,F.rows)));box.appendChild(fr)}

// ================== INICIO ==================
const DIFF=[null,
  {emo:'🐣',bg:'#4cbf4a',sh:'#2d8a2c'},{emo:'🙂',bg:'#33b6e8',sh:'#1f86b0'},
  {emo:'😃',bg:'#2f6fdb',sh:'#1d4a9e'},{emo:'💪',bg:'#a46ae8',sh:'#6f3cb5'},
  {emo:'📦',bg:'#ff8a1f',sh:'#c95d00'},{emo:'🚀',bg:'#e63b2e',sh:'#a82015'},
  {emo:'🏆',bg:'#24506b',sh:'#122c3d'}];
function totalStars(){return Object.values(save.stars).reduce((a,b)=>a+b,0)}
const lvlUnlocked=n=>save.unlockAll||n===1||FIGURES.some(G=>!G.set&&G.lvl===n-1&&save.stars[G.id]>0);
const unlocked=i=>{const F=FIGS[i];return F.custom||F.set||lvlUnlocked(F.lvl)||save.stars[F.id]>0};
const progOf=F=>{const pr=save.prog[F.id];return pr&&pr.v===5&&pr.placed>0&&pr.placed<F.steps.length?pr:null};
function renderHome(){
  $('#total').textContent='⭐ '+totalStars();
  const last=save.last?FIGS.findIndex(F=>F.id===save.last):-1,cont=$('#cont');
  if(last>=0&&progOf(FIGS[last])){const F=FIGS[last];
    cont.innerHTML=`▶ Seguir ${F.emo} ${F.name} <span style="opacity:.7">${Math.round(progOf(F).placed/F.steps.length*100)}%</span>`;
    cont.dataset.i=last;cont.classList.remove('hidden')}else cont.classList.add('hidden');
  const nc=FIGS.filter(F=>F.custom).length;
  $('#goPapa').classList.toggle('hidden',!nc);$('#goPapa').textContent=`👨 De papá (${nc})`;
  const D=$('#diffs');D.innerHTML='';
  for(let n=1;n<LEVELS.length;n++){
    const d=DIFF[n],figs=FIGURES.filter(F=>F.lvl===n&&!F.set),done=figs.filter(F=>save.stars[F.id]>0).length;
    const b=document.createElement('button');b.className='diff'+(lvlUnlocked(n)?'':' locked');b.dataset.n=n;
    b.style.background=d.bg;b.style.boxShadow=`0 6px 0 ${d.sh}`;
    b.innerHTML=`<span class="emo">${d.emo}</span><span class="num">${n}</span><span class="rng">${LEVELS[n].range} fichas</span><span class="ds">⭐ ${done}/${figs.length}</span>`;
    D.appendChild(b);
  }
}
$('#diffs').addEventListener('click',ev=>{
  ac();const b=ev.target.closest('.diff');if(!b)return;const n=+b.dataset.n;
  if(!lvlUnlocked(n)){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');return}
  sTap();curLvl=n;show('menu');
});
$('#cont').addEventListener('click',()=>{ac();sTap();openFig(+$('#cont').dataset.i)});
try{if(window.top===window&&/^https?:$/.test(location.protocol))$('#go3d').classList.remove('hidden')}catch(e){}

// ================== MODELOS DE UN NIVEL ==================
function groupFigs(){return FIGS.map((F,i)=>[F,i]).filter(([F])=>curLvl==='papa'?F.custom:curLvl==='rescate'?F.set==='rescate':(!F.custom&&!F.set&&F.lvl===curLvl))}
function renderMenu(){
  const figs=groupFigs();
  if(curLvl==='papa')$('#lvlName').textContent='👨 Modelos de papá';
  else if(curLvl==='rescate')$('#lvlName').textContent='🚨 Brigada de Rescate';
  else $('#lvlName').textContent=`${DIFF[curLvl].emo} Nivel ${curLvl} · ${LEVELS[curLvl].range} fichas`;
  $('#lvlStars').textContent='⭐ '+figs.reduce((a,[F])=>a+(save.stars[F.id]||0),0);
  const L=$('#levels');L.innerHTML='';
  if(!figs.length){L.innerHTML='<div class="empty">Todavía no hay modelos aquí.</div>';return}
  const cards=document.createElement('div');cards.className='cards';
  const portrait=innerHeight>innerWidth,n=figs.length;
  const cols=portrait?(n>2?2:1):(n===4?2:Math.min(n,n>6?4:3));
  cards.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  figs.forEach(([F,i])=>{
    const b=document.createElement('button');b.className='card'+(unlocked(i)?'':' locked');b.dataset.i=i;
    const s=save.stars[F.id]||0,pr=progOf(F);
    b.innerHTML=`${pr?`<span class="prog">${Math.round(pr.placed/F.steps.length*100)}%</span>`:''}<div class="mini"><div></div></div><div class="foot">${F.emo} ${F.name} · 🧱 ${F.steps.length}${F.bags.length>1?' · 📦 '+F.bags.length:''}${s?' · ⭐ '+s:''}</div>`;
    cards.appendChild(b)});
  L.appendChild(cards);
  L.querySelectorAll('.card').forEach(b=>{
    const F=FIGS[+b.dataset.i],m=b.querySelector('.mini');
    drawFigure(m.firstChild,F,Math.min(m.clientWidth*.85/F.cols,m.clientHeight*.82/(F.rows*PL)))});
}
$('#levels').addEventListener('click',ev=>{

  if(!unlocked(i)){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');return}

function show(name){screen=name;['home','menu','game','editor'].forEach(n=>$('#'+n).classList.toggle('hidden',n!==name));
  requestAnimationFrame(()=>{if(name==='home')renderHome();else if(name==='menu')renderMenu();else if(name==='game'){render();checkBag()}else renderEditor()})}

  const pr=save.prog[F.id];st=(pr&&pr.v===5&&pr.placed<F.steps.length)?pr:newState();keep();busy=false;show('game')}

// ================== JUEGO: estado y sobres ==================
const board=$('#board'),plate=$('#plate'),stage=$('#stage'),tray=$('#tray'),model=$('#model'),wrap=$('#boardWrap');
const nBags=()=>fig().bags.length;
const hasBags=()=>nBags()>1;
function bagIdx(i){const B=fig().bags;let b=0;while(b+1<B.length&&B[b+1]<=i)b++;return b}
function bagEnd(b){const F=fig();return b+1<F.bags.length?F.bags[b+1]:F.steps.length}
const curBag=()=>bagIdx(Math.min(st.placed,fig().steps.length-1));
function newState(){
  const F=fig(),extra=[];
  if(F.lvl>=4){const need=new Set(F.steps.map(key)),ks=['b1','b2','b3','p2','sI','qI','rd'],cs=Object.keys(COL).filter(c=>c!=='x');
    let guard=0;while(extra.length<(hasBags()?2:3)&&guard++<300){const p=P(ks[Math.random()*ks.length|0],cs[Math.random()*cs.length|0],0,0);
      if(!need.has(key(p))&&!extra.some(e=>key(e)===key(p)))extra.push(p)}}
  st={v:5,fig:F.id,placed:0,extra,opened:-1,order:[]};
  if(!hasBags())openBag(0,true);
  return st;
}
// bolsitas: la bandeja trae como mucho 4 tipos de ficha (+1 de más) para que se vean grandes;
// cuando se acaban, llega la siguiente bolsita
const MINI_KEYS=4;
function newMini(){
  const F=fig(),end0=bagEnd(curBag()),ks=[];let e=st.placed;
  while(e<end0){const k=key(F.steps[e]);if(!ks.includes(k)){if(ks.length>=MINI_KEYS)break;ks.push(k)}e++}
  st.miniEnd=e;
  const ex=st.extra.length?[key(st.extra[Math.random()*st.extra.length|0])]:[];
  st.order=shuffle([...ks,...ex]);
}
function openBag(b,silent){
  st.opened=b;newMini();
  if(!silent){keep();render()}
}
const sampleOf=k=>fig().steps.find(s=>key(s)===k)||st.extra.find(s=>key(s)===k);
const isExtra=k=>st.extra.some(s=>key(s)===k);
function remaining(k){if(isExtra(k))return 2;const F=fig(),end=st.miniEnd;let n=0;for(let i=st.placed;i<end;i++)if(key(F.steps[i])===k)n++;return n}
function keep(){save.prog[st.fig]=st;persist()}
function checkBag(){
  if(!hasBags()||st.placed>=fig().steps.length)return;
  const b=curBag();if(st.opened>=b)return;
  busy=true;say('Open the bag!');$('#bagN').textContent=`Sobre ${b+1}`;$('#bagS').textContent=`de ${nBags()} · ${bagEnd(b)-fig().bags[b]} fichas`;
  $('#bag').classList.remove('open');$('#bag').classList.add('show');
}
$('#bagBtn').addEventListener('pointerdown',()=>{
  ac();if($('#bag').classList.contains('open'))return;sRip();buzz(25);$('#bag').classList.add('open');
  setTimeout(()=>{$('#bag').classList.remove('show','open');busy=false;openBag(curBag())},450);
});
const bbox=ss=>({x0:Math.min(...ss.map(s=>s.x)),x1:Math.max(...ss.map(s=>s.x+s.w)),y0:Math.min(...ss.map(s=>s.y)),y1:Math.max(...ss.map(s=>s.y+s.h))});

// ================== JUEGO: dibujo ==================
function render(){
  const F=fig(),N=F.steps.length,done=st.placed>=N,cb=curBag(),bs=F.bags[cb],be=bagEnd(cb);
  $('#figName').textContent=F.emo+' '+F.name;
  $('#bagPill').classList.toggle('hidden',!hasBags());
  if(hasBags())$('#bagPill').textContent=`📦 ${Math.min(cb+1,nBags())}/${nBags()}`;
  $('#stars').textContent=done?'⭐ '+(save.stars[F.id]||0):'🧱 '+(N-st.placed);
  // ---- cámara: el tablero se dibuja entero y la cámara hace zoom/paneo suave hacia donde se está armando ----
  const r=stage.getBoundingClientRect(),RS=F.rows*PL;
  C=Math.max(6,Math.min(r.width*.9/F.cols,r.height*.8/(RS+.6),110));             // escala que muestra todo
  board.style.width=F.cols*C+'px';board.style.height=RS*C+'px';
  plate.style.width=(F.cols+.8)*C+'px';plate.style.height=Math.max(6,Math.min(C*.5,40))+'px';
  const plateH=parseFloat(plate.style.height);
  wrap.style.width=(F.cols+.8)*C+'px';
  const L0=(r.width-(F.cols+.8)*C)/2,T0=(r.height-RS*C-plateH)/2+r.height*.04;
  wrap.style.left=L0+'px';wrap.style.top=T0+'px';
  let z=1,tx=0,ty=0;
  const waitingBag=hasBags()&&st.opened<cb;
  if(!done&&!waitingBag&&C<34){
    if(st.miniEnd===undefined||st.placed>=st.miniEnd)newMini();
    const b=bbox(F.steps.slice(st.placed,Math.max(st.placed+1,st.miniEnd)));
    const vw=Math.max(b.x1-b.x0+5,12),vh=Math.max((b.y1-b.y0)*PL+4,8);
    z=Math.max(1,Math.min(r.width*.9/(vw*C),r.height*.8/(vh*C),4));
    const cx=(.4+(b.x0+b.x1)/2)*C,cy=(RS-(b.y0+b.y1)/2*PL)*C;                    // centro de la zona, en px del tablero
    tx=r.width/2-L0-cx*z;ty=r.height/2-T0-cy*z;
    // no mostrar mucho vacío fuera del modelo
    const W=(F.cols+.8)*C*z,H=(RS*C+plateH)*z;
    if(W>r.width)tx=Math.min(-L0+20,Math.max(r.width-L0-W-20,tx));else tx=(r.width-W)/2-L0;
    if(H>r.height)ty=Math.min(-T0+20,Math.max(r.height-T0-H-20,ty));
  }
  cam={L0,T0,tx,ty,z};
  wrap.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
  board.className='board';board.innerHTML='';
  const car=document.createElement('div');car.className='layer car';board.appendChild(car);
  const fr=document.createDocumentFragment();
  F.steps.forEach((s,i)=>{
    const el=at(pieceEl(s,C),s,C,F.rows);el.dataset.step=i;
    if(i>=st.placed){el.classList.add('ghost');if(i>=be)el.classList.add('far');
      if(i===st.placed&&st.opened>=cb)el.classList.add(helped()?'now':'shade')}
    fr.appendChild(el)});
  car.appendChild(fr);
  const mb=$('#modelBox').getBoundingClientRect(),mc=Math.min(mb.width*.84/F.cols,mb.height*.8/RS);
  drawFigure(model,F,mc);
  if(cam.z>1){const b=bbox(F.steps.slice(st.placed,Math.max(st.placed+1,st.miniEnd))),bx=document.createElement('div');bx.className='bagbox';
    Object.assign(bx.style,{left:b.x0*mc-3+'px',top:(F.rows-b.y1)*mc*PL-3+'px',width:(b.x1-b.x0)*mc+6+'px',height:(b.y1-b.y0)*mc*PL+6+'px'});model.appendChild(bx)}
  tray.innerHTML='';
  if(st.opened<cb||done)return;
  if(st.miniEnd===undefined||st.placed>=st.miniEnd)newMini();
  const nextK=key(F.steps[st.placed]);
  tray.style.gridTemplateRows='';tray.style.gridTemplateColumns='1fr';
  const tiles=st.order.map(k=>{const t=document.createElement('div');t.className='tile';t.dataset.k=k;tray.appendChild(t);return t});
  const t0=tiles[0];let uc=90;
  st.order.forEach(k=>{const q=sampleOf(k);uc=Math.min(uc,t0.clientWidth*.8/q.w,t0.clientHeight*.62/(q.h*PL+.25))});
  tiles.forEach(t=>{
    const k=t.dataset.k,s=sampleOf(k),n=remaining(k);
    if(!n){t.classList.add('used');return}
    if(k===nextK&&helped())t.classList.add('next');
    const pw=document.createElement('div');pw.className='pw';pw.style.width=s.w*uc+'px';pw.style.height=s.h*uc*PL+'px';
    const p=pieceEl(s,uc);p.style.left='0';p.style.top='0';pw.appendChild(p);t.appendChild(pw);
    if(n>1&&!isExtra(k))t.insertAdjacentHTML('beforeend',`<span class="cnt">×${n}</span>`);
  });
}
let wrong=0;
tray.addEventListener('pointerdown',ev=>{
  ac();const t=ev.target.closest('.tile');if(!t||busy||t.classList.contains('used'))return;
  const F=fig();if(st.placed>=F.steps.length)return;
  t.classList.add('press');setTimeout(()=>t.classList.remove('press'),120);
  const target=F.steps[st.placed];
  if(t.dataset.k!==key(target)){
    // equivocarse bloquea la bandeja un rato (cada vez más) y la ficha que sigue brinca para que la mire
    t.classList.remove('nope');void t.offsetWidth;t.classList.add('nope');sPop();say('Oops! Try again.');word('Oops!','#ff8a1f');
    combo=0;buzz([30,60,30]);wrong=Math.min(wrong+1,3);const ms=[0,1500,3000,5000][wrong];
    busy=true;tray.classList.add('wait');
    const g=board.querySelector(`[data-step="${st.placed}"]`);if(g){g.classList.remove('look');void g.offsetWidth;g.classList.add('look')}
    setTimeout(()=>{tray.classList.remove('wait');busy=false;if(g)g.classList.remove('look')},ms);
    return}
  wrong=0;buzz(12);
  fly(t,target);
});
function fly(t,target){
  busy=true;const F=fig();
  const src=t.querySelector('.pc').getBoundingClientRect(),sr=stage.getBoundingClientRect(),Z=cam.z;
  const bl=sr.left+cam.L0+cam.tx,bt=sr.top+cam.T0+cam.ty;
  const tl=bl+target.x*C*Z,tt=bt+(F.rows-target.y-target.h)*C*PL*Z;
  const clone=pieceEl(target,C*Z);clone.classList.add('fly');
  clone.style.left=tl+'px';clone.style.top=tt+'px';document.body.appendChild(clone);
  t.querySelector('.pw').style.visibility='hidden';sWhoosh();
  const s0=src.width/(target.w*C*Z),dx=src.left-tl,dy=src.top-tt,lift=Math.min(140,Math.abs(dx)*.35+60);
  const mx=dx*.45,my=Math.min(dy,0)*.5-lift;
  let done=false;
  const finish=()=>{if(done)return;done=true;clone.remove();
    const placedAt=st.placed,wasBag=curBag();st.placed++;keep();sSnap();combo++;
    {const nm=EN_COL[target.c]+' '+enShape(target.k);word(cap(nm),COL[target.c][0]);say(cap(nm)+'!');
     if(st.placed<F.steps.length&&st.placed%5===0)setTimeout(()=>say(PRAISE[Math.random()*PRAISE.length|0],true),150)}
    const N=F.steps.length,bagDone=hasBags()&&st.placed<N&&bagIdx(st.placed)!==wasBag;
    const fresh=!bagDone&&st.placed<N&&st.placed>=st.miniEnd;
    if(fresh){newMini();keep();sBag();say('New bag!',true)}
    render();
    if(fresh){tray.classList.remove('fresh');void tray.offsetWidth;tray.classList.add('fresh')}
    const el=board.querySelector(`[data-step="${placedAt}"]`);
    if(el){el.classList.add('pop');const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.bottom,COL[target.c][0],8+Math.min(combo,8))}
    shakeBoard();
    busy=false;
    if(st.placed===N)celebrate();
    else if(bagDone){busy=true;sBag();setTimeout(()=>{busy=false;render();checkBag()},700)}
  };
  const an=clone.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${s0}) rotate(0deg)`,offset:0},
    {transform:`translate(${mx}px,${my}px) scale(${Math.max(s0,1)*1.12}) rotate(-8deg)`,offset:.45},
    {transform:'translate(0,-14px) scale(1.05) rotate(2deg)',offset:.82},
    {transform:'translate(0,0) scale(1) rotate(0deg)',offset:1}],
    {duration:620,easing:'cubic-bezier(.35,.1,.3,1)',fill:'forwards'});
  an.onfinish=finish;setTimeout(finish,800);
}
function nextIdx(){const f=fig();const g=FIGS.map((F,i)=>[F,i]).filter(([F])=>f.set?F.set===f.set:(F.custom===f.custom&&!F.set&&(F.custom||F.lvl>=f.lvl)));
  const pos=g.findIndex(([,i])=>i===figIdx);return pos>=0&&pos+1<g.length?g[pos+1][1]:-1}
function celebrate(){
  busy=true;const F=fig();
  save.stars[F.id]=(save.stars[F.id]||0)+1;delete save.prog[F.id];persist();
  render();combo=0;
  {const sh=document.createElement('div');sh.className='shine';board.appendChild(sh);setTimeout(()=>sh.remove(),1000);
   const r=board.getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>sparks(r.left+Math.random()*r.width,r.top+Math.random()*r.height,'#ffd84d',8),i*90)}
  setTimeout(()=>{sFan();confetti();say('Good job! You did it!');word('GOOD JOB!','#ffd84d');
    if(F.anim==='launch'){const f=document.createElement('div');f.className='fx';const w=Math.min(F.cols*.35,3)*C;
      Object.assign(f.style,{width:w+'px',height:w*1.2+'px',left:(F.cols*C-w)/2+'px',top:F.rows*PL*C-.25*C+'px'});board.querySelector('.car').appendChild(f)}
    board.classList.add('go-'+F.anim)},400);
  $('#next').classList.toggle('hidden',nextIdx()<0);
  setTimeout(()=>{$('#stars').textContent='⭐ '+save.stars[F.id];$('#win').classList.add('show')},3400);
}
function confetti(){
  const cols=['#e63b2e','#ffc92a','#7fd3f7','#ff8a1f','#4cb54a','#b06cf0'];
  for(let i=0;i<50;i++){const d=document.createElement('div');d.className='conf';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
}
$('#again').addEventListener('pointerdown',()=>{ac();$('#win').classList.remove('show');newState();keep();busy=false;render();checkBag()});
$('#next').addEventListener('pointerdown',()=>{ac();$('#win').classList.remove('show');const n=nextIdx();if(n>=0)openFig(n)});

// =====================================================================
//  EDITOR: modo libre (niño) y modo papá (crear modelos)
//  Las fichas caen y se apoyan sobre lo que haya debajo, como al apilar Lego de verdad.
// =====================================================================
// modo libre: pocas fichas y base más chica (fichas grandes en pantalla); modo papá: catálogo completo
const E_FULL=['b1','b2','b3','b4','b6','b8','p1','p2','p4','p6','t1','t2','sI','sD','ri','qI','qD','rd','ojo','ar','ru'];
const E_SIMPLE=['b1','b2','b4','b6','p2','sI','sD','rd','ojo','ru'];
const C_SIMPLE=['r','y','a','g','o','w','x','m','n','b'];
let E_COLS=14,E_ROWS=30,E_SHAPES=E_SIMPLE;
function edDims(){const papa=ed.mode==='papa';E_COLS=papa?20:14;E_ROWS=papa?45:30;E_SHAPES=papa?E_FULL:E_SIMPLE}
const E_EMOS=['🚗','🏠','🤖','🦖','🚀','🏰','⛵','🐶','🌳','✈️','🚜','⭐'];
let ed={mode:'free',k:'b2',c:'r',rm:false,hist:[],C:30,sure:false};
const edPieces=()=>ed.mode==='free'?save.free:save.draft.pieces;
function setPieces(a){if(ed.mode==='free')save.free=a;else save.draft.pieces=a;persist()}
function openEditor(mode){ed.mode=mode;ed.rm=false;ed.hist=[];ed.sure=false;edDims();if(mode==='free'&&!C_SIMPLE.includes(ed.c))ed.c='r';if(!E_SHAPES.includes(ed.k))ed.k='b2';show('editor')}
function renderEditor(){
  const papa=ed.mode==='papa';
  $('#eTitle').textContent=papa?(save.draft.id?'👨‍🔧 Editando: '+(save.custom.find(c=>c.id===save.draft.id)||{}).name:'👨‍🔧 Modelo nuevo'):'🎨 Modo libre';
  document.querySelectorAll('.papaOnly').forEach(b=>b.classList.toggle('hidden',!papa));
  $('#eRm').classList.toggle('on',ed.rm);
  $('#eClear').textContent=ed.sure?'❓':'🗑️';
  // colores
  const cs=$('#eColors');cs.innerHTML='';
  (ed.mode==='papa'?Object.keys(COL):C_SIMPLE).forEach(c=>{const b=document.createElement('button');b.className='sw'+(c===ed.c?' sel':'');b.dataset.c=c;b.style.background=COL[c][0];cs.appendChild(b)});
  // formas (en el color elegido)
  const sh=$('#eShapes');sh.innerHTML='';
  E_SHAPES.forEach(k=>{const b=document.createElement('button');b.className='tile'+(k===ed.k&&!ed.rm?' sel':'');b.dataset.k=k;sh.appendChild(b)});
  const t0=sh.firstChild,tw=t0.clientWidth,th=t0.clientHeight;
  let uc=40;E_SHAPES.forEach(k=>{const T=CAT[k];uc=Math.min(uc,tw*.82/Math.min(T.w,4),th*.62/(T.h*PL+.25))});
  sh.querySelectorAll('.tile').forEach(b=>{const k=b.dataset.k,T=CAT[k],c=Math.min(uc*Math.min(1,4/T.w),uc);
    const s=P(k,k==='ru'?'x':ed.c,0,0),pw=document.createElement('div');pw.className='pw';pw.style.width=T.w*c+'px';pw.style.height=T.h*c*PL+'px';
    const p=pieceEl(s,c);p.style.left='0';p.style.top='0';pw.appendChild(p);b.appendChild(pw)});
  drawEditorBoard();
}
function drawEditorBoard(){
  const r=$('#eStage').getBoundingClientRect(),RS=E_ROWS*PL;
  const c=ed.C=Math.max(10,Math.min(r.width*.94/E_COLS,(r.height-30)*.94/RS));
  const B=$('#eBoard'),W=$('#eWrap');
  B.style.width=E_COLS*c+'px';B.style.height=RS*c+'px';
  $('#ePlate').style.width=E_COLS*c+'px';$('#ePlate').style.height=Math.max(8,Math.min(c*.5,30))+'px';
  W.style.left=(r.width-E_COLS*c)/2+'px';W.style.top=Math.max(4,(r.height-RS*c-parseFloat($('#ePlate').style.height))/2)+'px';
  B.className='board'+(ed.rm?' rm':'');B.innerHTML='';
  // cuadrícula suave: columnas de botón y filas de ladrillo
  const g=document.createElement('div');g.className='grid';
  g.style.backgroundImage=`linear-gradient(90deg,rgba(36,80,107,.07) 1px,transparent 1px),linear-gradient(rgba(36,80,107,.07) 1px,transparent 1px)`;
  g.style.backgroundSize=`${c}px ${3*PL*c}px`;g.style.backgroundPosition=`0 ${RS*c%(3*PL*c)}px`;B.appendChild(g);
  const fr=document.createDocumentFragment();
  edPieces().forEach((p,i)=>{const s=P(p.k,p.c,p.x,p.y),el=at(pieceEl(s,c),s,c,E_ROWS);el.dataset.i=i;fr.appendChild(el)});
  B.appendChild(fr);
  $('#eCount').textContent='🧱 '+edPieces().length;
}
// ¿cabe la ficha ahí sin chocar?
function freeAt(pcs,k,x,y){const T=CAT[k];return !pcs.some(p=>{const q=CAT[p.k];return p.x<x+T.w&&p.x+q.w>x&&p.y<y+T.h&&p.y+q.h>y})}
// Encaja la ficha en el lugar apoyado más cercano al dedo (sobre la base o sobre otra ficha), como un Lego real
function snapSpot(k,clientX,clientY){
  const B=$('#eBoard'),br=B.getBoundingClientRect(),c=ed.C,T=CAT[k],pcs=edPieces();
  const px=(clientX-br.left)/c,fy=(br.bottom-clientY)/(c*PL)-T.h/2;
  if(px<-1.5||px>E_COLS+1.5||clientY<br.top-c*2||clientY>br.bottom+c*3)return null;
  const x=Math.max(0,Math.min(E_COLS-T.w,Math.round(px-T.w/2)));
  const cand=new Set([0]);pcs.forEach(p=>{const q=CAT[p.k];if(p.x<x+T.w&&p.x+q.w>x)cand.add(p.y+q.h)});
  let best=null;cand.forEach(y=>{if(y+T.h>E_ROWS||!freeAt(pcs,k,x,y))return;if(best===null||Math.abs(y-fy)<Math.abs(best-fy))best=y});
  return best===null?null:{x,y:best};
}
function placeAt(k,spot){buzz(12);const pcs=edPieces();snapshot();pcs.push({k,c:k==='ru'?'x':ed.c,x:spot.x,y:spot.y});setPieces(pcs);sSnap();drawEditorBoard();
  const last=$('#eBoard').querySelector(`[data-i="${pcs.length-1}"]`);if(last){last.classList.add('pop');const r=last.getBoundingClientRect();sparks(r.left+r.width/2,r.bottom,COL[k==='ru'?'x':ed.c][0],8)}
  if(pcs.length%10===0)say(PRAISE[Math.random()*PRAISE.length|0],true)}
let preview=null;
function showPreview(k,spot){if(preview){preview.remove();preview=null}if(!spot)return;
  preview=at(pieceEl(P(k,k==='ru'?'x':ed.c,spot.x,spot.y),ed.C),P(k,'x',spot.x,spot.y),ed.C,E_ROWS);preview.classList.add('preview');$('#eBoard').appendChild(preview)}
function snapshot(){ed.hist.push(JSON.stringify(edPieces()));if(ed.hist.length>80)ed.hist.shift()}
$('#eColors').addEventListener('click',ev=>{const b=ev.target.closest('.sw');if(!b)return;ac();sTap();ed.c=b.dataset.c;ed.rm=false;renderEditor();
  say(cap(EN_COL[ed.c]));word(cap(EN_COL[ed.c]),COL[ed.c][0],$('#eStage'))});
let drag=null;
$('#eShapes').addEventListener('pointerdown',ev=>{const b=ev.target.closest('.tile');if(!b)return;
  drag={k:b.dataset.k,x0:ev.clientX,y0:ev.clientY,moved:false,el:null};});
document.addEventListener('pointermove',ev=>{if(!drag)return;
  if(!drag.moved&&Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)<10)return;
  if(!drag.moved){drag.moved=true;ac();ed.k=drag.k;ed.rm=false;
    const s=P(drag.k,drag.k==='ru'?'x':ed.c,0,0);drag.el=pieceEl(s,ed.C);drag.el.classList.add('dragging');document.body.appendChild(drag.el);
    drag.w=CAT[drag.k].w*ed.C;drag.h=CAT[drag.k].h*ed.C*PL}
  drag.el.style.left=(ev.clientX-drag.w/2)+'px';drag.el.style.top=(ev.clientY-drag.h-30)+'px';
  showPreview(drag.k,snapSpot(drag.k,ev.clientX,ev.clientY-30-drag.h/2));
},{passive:true});
document.addEventListener('pointerup',ev=>{if(!drag)return;const d=drag;drag=null;
  if(!d.moved)return;
  d.el.remove();const spot=snapSpot(d.k,ev.clientX,ev.clientY-30-d.h/2);showPreview(null,null);
  if(spot){placeAt(d.k,spot);const nm=(d.k==='ru'?'':EN_COL[ed.c]+' ')+enShape(d.k);say(cap(nm))}else sPop();
  renderEditor();
});
$('#eShapes').addEventListener('click',ev=>{const b=ev.target.closest('.tile');if(!b)return;if(ev.detail===0&&false)return;ac();sTap();ed.k=b.dataset.k;ed.rm=false;renderEditor();
  const nm=(ed.k==='ru'?'':EN_COL[ed.c]+' ')+enShape(ed.k);say(cap(nm));word(cap(nm),ed.k==='ru'?'#fff':COL[ed.c][0],$('#eStage'))});
$('#eStage').addEventListener('pointerdown',ev=>{
  ac();const B=$('#eBoard'),br=B.getBoundingClientRect(),c=ed.C,pcs=edPieces();
  if(ed.rm){
    const el=ev.target.closest('.pc');if(!el||el.dataset.i===undefined)return;
    const i=+el.dataset.i,p=pcs[i],T=CAT[p.k];
    const onTop=pcs.some((q,j)=>j!==i&&q.y===p.y+T.h&&q.x<p.x+T.w&&q.x+CAT[q.k].w>p.x);
    if(onTop){el.classList.remove('nope');void el.offsetWidth;el.style.animation='nope .45s';return}
    snapshot();pcs.splice(i,1);setPieces(pcs);sPop();drawEditorBoard();return;
  }
  const spot=snapSpot(ed.k,ev.clientX,ev.clientY);
  if(!spot){sPop();return}
  placeAt(ed.k,spot);
});
$('#eUndo').addEventListener('pointerdown',()=>{ac();if(!ed.hist.length)return;setPieces(JSON.parse(ed.hist.pop()));sPop();drawEditorBoard()});
$('#eRm').addEventListener('pointerdown',()=>{ac();ed.rm=!ed.rm;renderEditor()});
$('#eClear').addEventListener('pointerdown',()=>{ac();if(!edPieces().length)return;
  if(!ed.sure){ed.sure=true;renderEditor();setTimeout(()=>{if(ed.sure){ed.sure=false;if(screen==='editor')renderEditor()}},2500);return}
  ed.sure=false;snapshot();setPieces([]);sPop();renderEditor()});
$('#eBack').addEventListener('pointerdown',()=>{ac();show('home')});
$('#eImport').addEventListener('pointerdown',()=>{ac();if(!save.free.length)return;snapshot();setPieces(JSON.parse(JSON.stringify(save.free)));sSnap();drawEditorBoard()});
// ---- guardar como modelo (papá) ----
let sEmo='🚗';
$('#eSave').addEventListener('pointerdown',()=>{ac();const n=edPieces().length;if(!n)return;
  const cur=save.custom.find(c=>c.id===save.draft.id);
  $('#sName').value=cur?cur.name:'';sEmo=cur?cur.emo:'🚗';
  $('#sInfo').textContent=`🧱 ${n} fichas · Nivel ${lvlFor(n)}${n>BAG_FROM?' · 📦 en sobres':''}`;
  $('#sEmos').innerHTML=E_EMOS.map(e=>`<button class="${e===sEmo?'sel':''}">${e}</button>`).join('');
  $('#saveDlg').classList.add('show');setTimeout(()=>$('#sName').focus(),50)});
$('#sEmos').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;sEmo=b.textContent;
  $('#sEmos').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))});
$('#sCancel').addEventListener('click',()=>$('#saveDlg').classList.remove('show'));
$('#sOk').addEventListener('click',()=>{
  const name=$('#sName').value.trim()||'Modelo de papá';
  let cur=save.custom.find(c=>c.id===save.draft.id);
  if(!cur){cur={id:'c'+Date.now()};save.custom.push(cur)}
  cur.name=name;cur.emo=sEmo;cur.pieces=JSON.parse(JSON.stringify(edPieces()));
  delete save.prog[cur.id];save.draft={id:cur.id,pieces:cur.pieces.slice()};persist();rebuildFigs();
  $('#saveDlg').classList.remove('show');sFan();renderEditor();
});

// ================== PANEL DE PAPÁS (clave: 1234) ==================
const PARENT_CODE='1234';
let pin='';
function pRender(){
  $('#pdots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('');
  $('#pEnglish').textContent=save.noEnglish?'🇺🇸 Activar inglés (palabras y voz)':'🇺🇸 Inglés activado — tocar para quitar';
  $('#pHaptic').textContent=save.noHaptic?'📳 Activar vibración':'📳 Vibración activada — tocar para quitar';
  $('#pUnlock').textContent=save.unlockAll?'🔒 Volver a bloquear niveles':'🔓 Desbloquear todo';
  $('#pList').innerHTML=save.custom.map(c=>`<div class="crow"><span>${c.emo} ${c.name} · 🧱 ${c.pieces.length}</span><button data-ed="${c.id}">✏️</button><button data-del="${c.id}">🗑️</button></div>`).join('');
}
$('#pkeys').innerHTML=['1','2','3','4','5','6','7','8','9','⌫','0',''].map(k=>`<button data-k="${k}" ${k?'':'style="visibility:hidden"'}>${k}</button>`).join('');
$('#gear').addEventListener('click',()=>{ac();pin='';$('#pcode').classList.remove('hidden');$('#popts').classList.add('hidden');
  $('#pReset').dataset.sure='';$('#pReset').textContent='🗑️ Borrar avance y estrellas';pRender();$('#parents').classList.add('show')});
$('#pkeys').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b||!b.dataset.k)return;const k=b.dataset.k;
  if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;
  pRender();
  if(pin.length===4){
    if(pin===PARENT_CODE){sTap();$('#pcode').classList.add('hidden');$('#popts').classList.remove('hidden')}
    else{const d=$('#pdots');d.classList.remove('bad');void d.offsetWidth;d.classList.add('bad');setTimeout(()=>{pin='';pRender()},450)}
  }
});
$('#pBuild').addEventListener('click',()=>{$('#parents').classList.remove('show');
  if(save.draft.id)save.draft={id:null,pieces:[]};persist();openEditor('papa')});
$('#pList').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.ed){const c=save.custom.find(x=>x.id===b.dataset.ed);save.draft={id:c.id,pieces:JSON.parse(JSON.stringify(c.pieces))};persist();
    $('#parents').classList.remove('show');openEditor('papa')}
  if(b.dataset.del){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='❓';return}
    save.custom=save.custom.filter(x=>x.id!==b.dataset.del);delete save.prog[b.dataset.del];delete save.stars[b.dataset.del];
    if(save.draft.id===b.dataset.del)save.draft={id:null,pieces:[]};persist();rebuildFigs();pRender();renderHome()}
});
$('#pEnglish').addEventListener('click',()=>{save.noEnglish=!save.noEnglish;persist();pRender();if(!save.noEnglish)say('Hello! Let\'s build!')});
$('#pHaptic').addEventListener('click',()=>{save.noHaptic=!save.noHaptic;persist();pRender();buzz(20)});
$('#pUnlock').addEventListener('click',()=>{save.unlockAll=!save.unlockAll;persist();sFan();pRender();renderHome()});
$('#pReset').addEventListener('click',()=>{const b=$('#pReset');
  if(!b.dataset.sure){b.dataset.sure='1';b.textContent='¿Seguro? Toca otra vez para borrar';return}
  save.stars={};save.prog={};save.last=null;persist();b.dataset.sure='';b.textContent='✅ Borrado';renderHome()});
$('#pClose').addEventListener('click',()=>$('#parents').classList.remove('show'));
if(location.hash==='#desbloquear'){save.unlockAll=true;persist()}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(busy&&!$('#bag').classList.contains('show'))return;
  screen==='home'?renderHome():screen==='menu'?renderMenu():screen==='game'?render():renderEditor()},120)});
updSnd();updMus();
show('home');
</script>
